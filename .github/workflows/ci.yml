name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results

  deploy:
    # Runs only on main, and only once the FIREBASE_SERVICE_ACCOUNT secret exists (see README).
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_SA == 'true'
      - run: npm run build # Firebase config comes from .env.production
        if: env.HAS_SA == 'true'
      - name: Deploy to Firebase Hosting
        if: env.HAS_SA == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx -y firebase-tools@latest deploy --only hosting --project huayu-lah --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/sa.json"
          if [ "$status" -ne 0 ]; then
            # surface the cause as annotations (readable without downloading logs)
            grep -iE 'error|denied|permission|not found|not enabled|403|404' "$RUNNER_TEMP/deploy.log" | tail -8 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
      - if: env.HAS_SA != 'true'
        run: echo "Skipping deploy — add the FIREBASE_SERVICE_ACCOUNT secret to enable it."
