name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results

  deploy:
    # Runs only on main, and only once the FIREBASE_SERVICE_ACCOUNT secret exists (see README).
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_SA == 'true'
      - run: npm run build # Firebase config comes from .env.production
        if: env.HAS_SA == 'true'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_SA == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: huayu-lah
          channelId: live
      - if: env.HAS_SA != 'true'
        run: echo "Skipping deploy — add the FIREBASE_SERVICE_ACCOUNT secret to enable it."
